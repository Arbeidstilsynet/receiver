name: Publish changed packages

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  check_publish_targets:
    name: Check publish targets
    runs-on: ubuntu-latest
    outputs:
      is-prerelease: ${{ steps.prerelease_check.outputs.is_prerelease }}
      publish-version: ${{ steps.csproj-metadata.outputs.version }}
      nuget-published: ${{ steps.nuget_version_check.outputs.published }}
      npm-published: ${{ steps.npm_version_check.outputs.published }}
      image-published: ${{ steps.ghcr_image_check.outputs.published }}
      release-published: ${{ steps.release_check.outputs.published }}
      all-published: ${{ steps.publish_status.outputs.all_published }}
    permissions:
      contents: read
      actions: read
      packages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Get version and name from csproj file
        id: csproj-metadata
        uses: Arbeidstilsynet/action-dotnet-get-csproj-metadata@1ce26ff56a71e150145f2f95c235a0d18c899bb7 # v1
        with:
          working-directory: ./src/Publish/Receiver.Publish

      - name: Check if version is prerelease
        id: prerelease_check
        shell: bash
        run: |
          VERSION="${{ steps.csproj-metadata.outputs.version }}"
          if [[ "$VERSION" == *-* ]]; then
            echo "is_prerelease=true" >> $GITHUB_OUTPUT
          else
            echo "is_prerelease=false" >> $GITHUB_OUTPUT
          fi

      - name: Check if package version exists in NuGet
        id: nuget_version_check
        uses: Arbeidstilsynet/action-nuget-check-published@e9d27df91e2e0a5c4b6b041dd111127ba02d7b22 # v2
        with:
          name: ${{ steps.csproj-metadata.outputs.name }}
          version: ${{ steps.csproj-metadata.outputs.version }}
          source-feed: nuget
          config-file: ./nuget.config

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          package-manager-cache: false

      - name: Get npm package name
        id: npm_metadata
        working-directory: ./src/npm_publish
        shell: bash
        run: |
          NPM_PACKAGE_NAME="$(node -p "require('./package.json').name")"
          echo "name=$NPM_PACKAGE_NAME" >> $GITHUB_OUTPUT

      - name: Check if npm package version exists
        id: npm_version_check
        shell: bash
        run: |
          set -euo pipefail

          package_ref="${{ steps.npm_metadata.outputs.name }}@${{ steps.csproj-metadata.outputs.version }}"
          error_log="$(mktemp)"

          if npm view "$package_ref" version > /dev/null 2> "$error_log"; then
            echo "published=true" >> $GITHUB_OUTPUT
          elif grep -q "E404" "$error_log"; then
            echo "published=false" >> $GITHUB_OUTPUT
          else
            echo "::error::Failed to check npm package version for $package_ref."
            cat "$error_log"
            exit 1
          fi

      - name: Check if Docker image exists in GHCR
        id: ghcr_image_check
        shell: bash
        run: |
          set -euo pipefail

          VERSION="${{ steps.csproj-metadata.outputs.version }}"
          error_log="$(mktemp)"

          if gh api "/orgs/arbeidstilsynet/packages/container/receiver/versions?per_page=100" \
              --jq "[.[].metadata.container.tags[] | select(. == \"$VERSION\")] | length > 0" \
              2> "$error_log" | grep -q "^true$"; then
            echo "published=true" >> $GITHUB_OUTPUT
          elif grep -qE "404|Not Found" "$error_log"; then
            echo "published=false" >> $GITHUB_OUTPUT
          else
            echo "published=false" >> $GITHUB_OUTPUT
            echo "::warning::Could not determine GHCR image status; assuming unpublished."
            cat "$error_log"
          fi
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Check if GitHub Release exists
        id: release_check
        shell: bash
        run: |
          set -euo pipefail
          TAG="${{ steps.csproj-metadata.outputs.name }}@${{ steps.csproj-metadata.outputs.version }}"
          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "published=true" >> $GITHUB_OUTPUT
          else
            echo "published=false" >> $GITHUB_OUTPUT
          fi
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Log publish status
        id: publish_status
        shell: bash
        run: |
          NUGET="${{ steps.nuget_version_check.outputs.published }}"
          NPM="${{ steps.npm_version_check.outputs.published }}"
          IMAGE="${{ steps.ghcr_image_check.outputs.published }}"
          RELEASE="${{ steps.release_check.outputs.published }}"
          VERSION="${{ steps.csproj-metadata.outputs.version }}"
          echo "Version $VERSION — NuGet: $NUGET, npm: $NPM, image: $IMAGE, release: $RELEASE"
          if [ "$NUGET" = "true" ] && [ "$NPM" = "true" ] && [ "$IMAGE" = "true" ] && [ "$RELEASE" = "true" ]; then
            echo "all_published=true" >> $GITHUB_OUTPUT
          else
            echo "all_published=false" >> $GITHUB_OUTPUT
          fi

  already_published:
    name: Stop when already published
    needs: [check_publish_targets]
    if: ${{ needs.check_publish_targets.outputs.all-published == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Report skipped publish
        shell: bash
        run: |
          echo "Version ${{ needs.check_publish_targets.outputs['publish-version'] }} is already published to all targets."

  check_pr_publish_version:
    name: Check PR publish version
    needs: [check_publish_targets]
    if: ${{ github.event_name == 'pull_request' && needs.check_publish_targets.outputs.all-published != 'true' }}
    uses: ./.github/workflows/build-pr-template.yml
    permissions:
      contents: read
      actions: read

  publish_prerelease_when_changed:
    name: Publish prerelease if changed
    needs: [check_publish_targets, check_pr_publish_version]
    if: ${{ github.event_name == 'pull_request' && needs.check_publish_targets.outputs.all-published != 'true' && needs.check_pr_publish_version.outputs['is-prerelease'] == 'true' && github.event.pull_request.head.repo.full_name == github.repository }}
    uses: ./.github/workflows/publish-template.yml
    permissions:
      id-token: write
      contents: write
      packages: write
    with:
      is-prerelease: true
      nuget-published: ${{ needs.check_publish_targets.outputs.nuget-published == 'true' }}
      npm-published: ${{ needs.check_publish_targets.outputs.npm-published == 'true' }}
      image-published: ${{ needs.check_publish_targets.outputs.image-published == 'true' }}
      release-published: ${{ needs.check_publish_targets.outputs.release-published == 'true' }}

  publish_release_when_changed:
    name: Publish release if changed
    needs: [check_publish_targets]
    if: ${{ github.event_name == 'push' && needs.check_publish_targets.outputs.all-published != 'true' }}
    uses: ./.github/workflows/publish-template.yml
    permissions:
      id-token: write
      contents: write
      packages: write
    with:
      is-prerelease: false
      nuget-published: ${{ needs.check_publish_targets.outputs.nuget-published == 'true' }}
      npm-published: ${{ needs.check_publish_targets.outputs.npm-published == 'true' }}
      image-published: ${{ needs.check_publish_targets.outputs.image-published == 'true' }}
      release-published: ${{ needs.check_publish_targets.outputs.release-published == 'true' }}
