name: Publish changed package (reusable)

on:
  workflow_call:
    inputs:
      is-prerelease:
        description: "Whether the version to publish is a prerelease"
        required: true
        type: boolean
      nuget-published:
        description: "Whether the NuGet package version is already published"
        required: true
        type: boolean
      npm-published:
        description: "Whether the npm package version is already published"
        required: true
        type: boolean
      image-published:
        description: "Whether the Docker image is already published"
        required: true
        type: boolean

jobs:
  setup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      version: ${{ steps.get_metadata_from_csprojectfile.outputs.version }}
      name: ${{ steps.get_metadata_from_csprojectfile.outputs.name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.ref }}

      - name: Get version and name from csproj file
        id: get_metadata_from_csprojectfile
        uses: Arbeidstilsynet/action-dotnet-get-csproj-metadata@1ce26ff56a71e150145f2f95c235a0d18c899bb7 # v1
        with:
          working-directory: ./src/Publish/Receiver.Publish

  publish-prerelease:
    needs: setup
    if: inputs.is-prerelease == true
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      id-token: write
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          package-manager-cache: false

      - name: Publish npm package if not already published
        if: inputs.npm-published == false
        working-directory: ./src/npm_publish
        run: |
          set -euo pipefail

          types_source="$(readlink types.d.ts || true)"
          if [ -z "$types_source" ]; then
            types_source="../generated/types.d.ts"
          fi

          if [ ! -f "$types_source" ]; then
            echo "::error::Unable to materialize npm package types from types.d.ts symlink or ../generated/types.d.ts."
            exit 1
          fi

          cp --remove-destination "$types_source" types.d.ts
          npm pkg set version="${{ needs.setup.outputs.version }}"
          npm publish --access public --tag next

      - name: Publish nuget package if not already published
        if: inputs.nuget-published == false
        uses: Arbeidstilsynet/action-dotnet-publish@d6a7f116db746d388ef2ca8d52d8f3d66b7cac05 # v3
        with:
          working-directory: ./src/Publish/Receiver.Publish
          nuget-username: ${{ vars.NUGET_BOT_USERNAME }}

      - name: Docker meta
        if: inputs.image-published == false
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: |
            ghcr.io/arbeidstilsynet/receiver
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=raw,value=${{ needs.setup.outputs.version }}

      - name: Log in to GHCR
        if: inputs.image-published == false
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Set up QEMU
        if: inputs.image-published == false
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3

      - name: Set up Docker Buildx
        if: inputs.image-published == false
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Build and push to GHCR
        if: inputs.image-published == false
        id: ghcr_build_push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: ./
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  publish-release:
    needs: setup
    if: inputs.is-prerelease == false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      id-token: write
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          package-manager-cache: false

      - name: Publish npm package if not already published
        if: inputs.npm-published == false
        working-directory: ./src/npm_publish
        run: |
          set -euo pipefail

          types_source="$(readlink types.d.ts || true)"
          if [ -z "$types_source" ]; then
            types_source="../generated/types.d.ts"
          fi

          if [ ! -f "$types_source" ]; then
            echo "::error::Unable to materialize npm package types from types.d.ts symlink or ../generated/types.d.ts."
            exit 1
          fi

          cp --remove-destination "$types_source" types.d.ts
          npm pkg set version="${{ needs.setup.outputs.version }}"
          npm publish --access public

      - name: Publish nuget package if not already published
        if: inputs.nuget-published == false
        uses: Arbeidstilsynet/action-dotnet-publish@d6a7f116db746d388ef2ca8d52d8f3d66b7cac05 # v3
        with:
          working-directory: ./src/Publish/Receiver.Publish
          nuget-username: ${{ vars.NUGET_BOT_USERNAME }}

      - name: Docker meta
        if: inputs.image-published == false
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: |
            ghcr.io/arbeidstilsynet/receiver
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=raw,value=${{ needs.setup.outputs.version }}

      - name: Log in to GHCR
        if: inputs.image-published == false
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build and push image to NAIS registry
        if: inputs.image-published == false
        id: nais_build_push
        uses: nais/docker-build-push@31c3a7321909bcb20799fdf46153fec721fd9512 # v0
        with:
          team: meldinger
          docker_context: ./
          dockerfile: ./Dockerfile
          tag: ${{ needs.setup.outputs.version }}
          platforms: linux/amd64,linux/arm64
          salsa: true

      - name: Push image to GHCR (from NAIS image)
        if: inputs.image-published == false
        shell: bash
        run: |
          set -euo pipefail

          src_image='${{ steps.nais_build_push.outputs.image }}'
          if [ -z "$src_image" ]; then
            echo "::error::nais/docker-build-push did not produce an image output."
            exit 1
          fi

          # Convert multiline tags into repeated "-t <tag>" args
          args=()
          while IFS= read -r tag; do
            [ -z "$tag" ] && continue
            args+=( -t "$tag" )
          done <<< '${{ steps.meta.outputs.tags }}'

          docker buildx imagetools create "${args[@]}" "$src_image"

      - name: Prepare NAIS image reference
        if: inputs.image-published == false
        id: nais_image_ref
        shell: bash
        run: |
          set -euo pipefail

          src_image='${{ steps.nais_build_push.outputs.image }}'
          if [ -z "$src_image" ]; then
            echo "::error::nais/docker-build-push did not produce an image output."
            exit 1
          fi

          # Normalize to repository-only so registry/repository changes are inherited
          # from nais/docker-build-push output while we control the release tag.
          image_repo="${src_image%@*}"
          image_repo="${image_repo%:*}"
          echo "image_repo=$image_repo" >> "$GITHUB_OUTPUT"

      - name: Generate SBOM and sign NAIS image
        if: inputs.image-published == false
        uses: nais/attest-sign@257e2d7a5964fb8e35173227c9496ad2a098e9c6 # v2
        with:
          image_ref: ${{ steps.nais_image_ref.outputs.image_repo }}:${{ needs.setup.outputs.version }}@${{ steps.nais_build_push.outputs.digest }}

      - name: Extract changelog section for current version
        if: inputs.nuget-published == false
        id: changelog
        run: |
          VERSION="${{ needs.setup.outputs.version }}"
          if [ -f src/CHANGELOG.md ]; then
            awk -v ver="$VERSION" '
              BEGIN {found=0}
              # Match headings like ## 1.2.3 or ## [1.2.3]
              $0 ~ "^##[[:space:]]*\\[?"ver"\\]?" {found=1; print; next}
              found && /^##[[:space:]]*\[?[0-9]+\.[0-9]+\.[0-9]+/ {exit}
              found {print}
            ' src/CHANGELOG.md > section.txt
            echo 'changelog<<EOF' >> $GITHUB_OUTPUT
            cat section.txt >> $GITHUB_OUTPUT
            echo 'EOF' >> $GITHUB_OUTPUT
          else
            echo 'changelog=No changelog found.' >> $GITHUB_OUTPUT
          fi

      - name: Create GitHub Release
        if: inputs.nuget-published == false
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3
        with:
          tag_name: "${{ needs.setup.outputs.name }}@${{ needs.setup.outputs.version }}"
          name: "${{ needs.setup.outputs.name }} v${{ needs.setup.outputs.version }}"
          body: ${{ steps.changelog.outputs.changelog }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
