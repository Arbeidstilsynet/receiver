name: Publish changed package (reusable)

on:
  workflow_call:
    inputs:
      is-prerelease:
        description: "Whether the version to publish is a prerelease"
        required: true
        type: boolean

jobs:
  publish_prerelease:
    if: inputs.is-prerelease == true
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ github.ref }}

      - name: Get version and name from csproj file
        id: get_metadata_from_csprojectfile
        uses: Arbeidstilsynet/action-dotnet-get-csproj-metadata@1ce26ff56a71e150145f2f95c235a0d18c899bb7 # v1
        with:
          working-directory: ./src/Publish/Receiver.Publish

      - name: Check if package version exists
        id: nuget_version_check
        uses: Arbeidstilsynet/action-nuget-check-published@c706392290e42d3ee19cf8c22be9678c716703e0 # v2
        with:
          name: ${{ steps.get_metadata_from_csprojectfile.outputs.name }}
          version: ${{ steps.get_metadata_from_csprojectfile.outputs.version }}

      - name: Publish package if not already published
        id: publish
        if: steps.nuget_version_check.outputs.published == 'false'
        uses: Arbeidstilsynet/action-dotnet-publish@74f56a48df6466a1b1986cd298a71ed8a94311b6 # v3
        with:
          working-directory: ./src/Publish/Receiver.Publish
          nuget-username: ${{ vars.NUGET_BOT_USERNAME }}
      - name: Docker meta
        if: steps.nuget_version_check.outputs.published == 'false'
        id: meta
        uses: docker/metadata-action@80c7e94dd9b9319bd5eb7a0e0fe9291e23a2a2e9 # v6
        with:
          images: |
            ghcr.io/arbeidstilsynet/receiver
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=raw,value=${{ steps.get_metadata_from_csprojectfile.outputs.version }}

      - name: Log in to GHCR
        if: steps.nuget_version_check.outputs.published == 'false'
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push (GHCR)
        if: steps.nuget_version_check.outputs.published == 'false'
        id: ghcr_build_push
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7
        with:
          context: ./src/
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Generate SBOM and sign GHCR image
        if: steps.nuget_version_check.outputs.published == 'false'
        uses: nais/attest-sign@2548fccb3e472f3f65d1cf0fe6e339c7675d3c55 # v2
        with:
          image_ref: ghcr.io/arbeidstilsynet/receiver@${{ steps.ghcr_build_push.outputs.digest }}

  publish_release:
    if: inputs.is-prerelease == false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Get version and name from csproj file
        id: get_metadata_from_csprojectfile
        uses: Arbeidstilsynet/action-dotnet-get-csproj-metadata@1ce26ff56a71e150145f2f95c235a0d18c899bb7 # v1
        with:
          working-directory: ./src/Publish/Receiver.Publish

      - name: Check if package version exists
        id: nuget_version_check
        uses: Arbeidstilsynet/action-nuget-check-published@c706392290e42d3ee19cf8c22be9678c716703e0 # v2
        with:
          name: ${{ steps.get_metadata_from_csprojectfile.outputs.name }}
          version: ${{ steps.get_metadata_from_csprojectfile.outputs.version }}

      - name: Publish package if not already published
        id: publish
        if: steps.nuget_version_check.outputs.published == 'false'
        uses: Arbeidstilsynet/action-dotnet-publish@74f56a48df6466a1b1986cd298a71ed8a94311b6 # v3
        with:
          working-directory: ./src/Publish/Receiver.Publish
          nuget-username: ${{ vars.NUGET_BOT_USERNAME }}

      - name: Docker meta
        if: steps.nuget_version_check.outputs.published == 'false'
        id: meta
        uses: docker/metadata-action@80c7e94dd9b9319bd5eb7a0e0fe9291e23a2a2e9 # v6
        with:
          images: |
            ghcr.io/arbeidstilsynet/receiver
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=raw,value=${{ steps.get_metadata_from_csprojectfile.outputs.version }}

      - name: Log in to GHCR
        if: steps.nuget_version_check.outputs.published == 'false'
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image to NAIS registry
        if: steps.nuget_version_check.outputs.published == 'false'
        id: nais_build_push
        uses: nais/docker-build-push@05dbb6091b30bd84279c6d64a45ef8782fd410a5 # v0
        with:
          team: meldinger
          docker_context: ./src/
          dockerfile: ./src/Dockerfile
          tag: ${{ steps.get_metadata_from_csprojectfile.outputs.version }}
          salsa: true

      - name: Push image to GHCR (from NAIS image)
        if: steps.nuget_version_check.outputs.published == 'false'
        shell: bash
        run: |
          set -euo pipefail

          src_image='${{ steps.nais_build_push.outputs.image }}'
          if [ -z "$src_image" ]; then
            echo "::error::nais/docker-build-push did not produce an image output."
            exit 1
          fi

          # Convert multiline tags into repeated "-t <tag>" args
          args=()
          while IFS= read -r tag; do
            [ -z "$tag" ] && continue
            args+=( -t "$tag" )
          done <<< '${{ steps.meta.outputs.tags }}'

          docker buildx imagetools create "${args[@]}" "$src_image"

      - name: Generate SBOM and sign GHCR image
        if: steps.nuget_version_check.outputs.published == 'false'
        uses: nais/attest-sign@2548fccb3e472f3f65d1cf0fe6e339c7675d3c55 # v2
        with:
          image_ref: ghcr.io/arbeidstilsynet/receiver@${{ steps.nais_build_push.outputs.digest }}

      - name: Extract changelog section for current version
        if: steps.nuget_version_check.outputs.published == 'false'
        id: changelog
        working-directory: ./src/
        run: |
          VERSION="${{ steps.get_metadata_from_csprojectfile.outputs.version }}"
          if [ -f CHANGELOG.md ]; then
            awk -v ver="$VERSION" '
              BEGIN {found=0}
              # Match headings like ## 1.2.3 or ## [1.2.3]
              $0 ~ "^##[[:space:]]*\\[?"ver"\\]?" {found=1; print; next}
              found && /^##[[:space:]]*\[?[0-9]+\.[0-9]+\.[0-9]+/ {exit}
              found {print}
            ' CHANGELOG.md > section.txt
            echo 'changelog<<EOF' >> $GITHUB_OUTPUT
            cat section.txt >> $GITHUB_OUTPUT
            echo 'EOF' >> $GITHUB_OUTPUT
          else
            echo 'changelog=No changelog found.' >> $GITHUB_OUTPUT
          fi

      - name: Create GitHub Release
        if: steps.nuget_version_check.outputs.published == 'false'
        uses: softprops/action-gh-release@b4309332981a82ec1c5618f44dd2e27cc8bfbfda # v3
        with:
          tag_name: "${{ steps.get_metadata_from_csprojectfile.outputs.name }}@${{ steps.get_metadata_from_csprojectfile.outputs.version }}"
          name: "${{ steps.get_metadata_from_csprojectfile.outputs.name }} v${{ steps.get_metadata_from_csprojectfile.outputs.version }}"
          body: ${{ steps.changelog.outputs.changelog }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}