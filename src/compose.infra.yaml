name: meldinger

networks:
  meldinger_network:
    name: meldinger_network

services:
  valkey:
    image: valkey/valkey:latest@sha256:3b55fbaa0cd93cf0d9d961f405e4dfcc70efe325e2d84da207a0a8e6d8fde4f9
    networks:
      - meldinger_network
    volumes:
      - valkey-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep PONG"]
      interval: 1s
      timeout: 3s
      retries: 5
    ports:
      - 6379:6379

  postgres-receiver:
    image: postgres:17-alpine@sha256:e8620ab449ee1dc2d47356b6a82806c22a2c68d46b9620b689723570ed9df927
    networks:
      - meldinger_network
    ports:
      - 5432:5432
    volumes:
      - postgres-receiver-data:/var/lib/postgresql/data
    environment:
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_USER=postgres
      - POSTGRES_DB=demo_db
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 1s
      timeout: 5s
      retries: 10

  file-storage:
    container_name: file-storage
    image: fsouza/fake-gcs-server@sha256:3730da0e31f7e5186a90ec4899dc2c336104e7599df400411392ef17e684c31f
    networks:
      - meldinger_network
    ports:
      - 4443:4443
    command: ["-scheme", "http", "-backend", "filesystem", "-external-url", "http://localhost:4443"]
    volumes:
      - cloudstorage-data:/data
    post_start:
      - command: ["apk", "add", "--no-cache", "curl"]
      - command:
          [
            "curl",
            "-X",
            "POST",
            "-d",
            "{\"name\": \"test-bucket\",  \"location\": \"EU\",  \"storageClass\": \"STANDARD\",   \"iamConfiguration\": {  \"uniformBucketLevelAccess\": { \"enabled\": true} }}",
            "-H",
            "Content-Type: application/json",
            "http://localhost:4443/storage/v1/b?project=localhost",
          ]
      - command:
          [
            "curl",
            "-X",
            "PUT",
            "-d",
            '{"externalUrl": "http://file-storage:4443"}',
            "-H",
            "Content-Type: application/json",
            "http://file-storage:4443/_internal/config",
          ]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4443/storage/v1/b/test-bucket"]
      interval: 1s
      timeout: 10s
      retries: 5

  clamav:
    image: clamav/clamav@sha256:898c176d1cfec61d4585f71d1e2e8515b3cc8d5f83cd9fc2f6748e8b20de82a2
    environment:
      MODE: clamd
    networks:
      - meldinger_network
    ulimits:
      stack: 1048576
    volumes:
      - clamav-data:/var/lib/clamav
    ports:
      - "3310:3310"
    healthcheck:
      test: ["CMD-SHELL", "echo 'PING' | nc -w 5 localhost 3310"]
      interval: 1s
      timeout: 5s
      retries: 10

  clamav-web:
    image: europe-north1-docker.pkg.dev/nais-io/nais/images/clamav-rest:latest@sha256:3e008ad77db6847bbde80c1c0ef7b747a8e864f4df08c67ac7253c64747b43e2
    container_name: clamav-web
    environment:
      DAEMON_ENDPOINT: clamav:3310
    ports:
      #http
      - "8091:8080"
    networks:
      - meldinger_network
    depends_on:
      clamav:
        condition: service_healthy

volumes:
  postgres-receiver-data:
  clamav-data:
  valkey-data:
  cloudstorage-data:
