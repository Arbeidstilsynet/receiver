name: meldinger

networks:
  meldinger_network:
    name: meldinger_network

services:
  valkey:
    image: valkey/valkey:latest@sha256:3acc0687f2a2e1091fae6450d7842dd658c941338cf0a873ddd9e14b9e4ea4dd
    networks:
      - meldinger_network
    volumes:
      - valkey-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep PONG"]
      interval: 1s
      timeout: 3s
      retries: 5
    ports:
      - 6379:6379

  postgres-receiver:
    image: postgres:17-alpine@sha256:742f40ea20b9ff2ff31db5458d127452988a2164df9e17441e191f3b72252193
    networks:
      - meldinger_network
    ports:
      - 5432:5432
    volumes:
      - postgres-receiver-data:/var/lib/postgresql/data
    environment:
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_USER=postgres
      - POSTGRES_DB=demo_db
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 1s
      timeout: 5s
      retries: 10

  file-storage:
    container_name: file-storage
    image: fsouza/fake-gcs-server@sha256:91afded49de804aa61b5f3eb6c7cd65205acf9e5c5e047cf0ba7d9507af806c8
    networks:
      - meldinger_network
    ports:
      - 4443:4443
    command:
      [
        "-scheme",
        "http",
        "-backend",
        "filesystem",
        "-external-url",
        "http://localhost:4443",
      ]
    volumes:
      - cloudstorage-data:/data
    post_start:
      - command: ["apk", "add", "--no-cache", "curl"]
      - command:
          [
            "curl",
            "-X",
            "POST",
            "-d",
            "{\"name\": \"test-bucket\",  \"location\":
              \"EU\",  \"storageClass\": \"STANDARD\",   \"iamConfiguration\":
              {  \"uniformBucketLevelAccess\": { \"enabled\": true} }}",
            "-H",
            "Content-Type: application/json",
            "http://localhost:4443/storage/v1/b?project=localhost",
          ]
      - command:
          [
            "curl",
            "-X",
            "PUT",
            "-d",
            "{\"externalUrl\": \"http://file-storage:4443\"}",
            "-H",
            "Content-Type: application/json",
            "http://file-storage:4443/_internal/config",
          ]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4443/storage/v1/b/test-bucket"]
      interval: 1s
      timeout: 10s
      retries: 5

  clamav:
    image: clamav/clamav@sha256:78810772a92b4a9168115bc6b2e0ffd702640893b9577f8c3d0432762d2655c4
    environment:
      MODE: clamd
    networks:
      - meldinger_network
    profiles:
      - virus-scan
    ulimits:
      stack: 1048576
    volumes:
      - clamav-data:/var/lib/clamav
    ports:
      - "3310:3310"
    healthcheck:
      test: ["CMD-SHELL", "echo 'PING' | nc -w 5 localhost 3310"]
      interval: 1s
      timeout: 5s
      retries: 10

  clamav-web:
    image: europe-north1-docker.pkg.dev/nais-io/nais/images/clamav-rest:latest@sha256:1e59fe539ad8acb2acd98d313974f24737287cf3323be9c17ec15a26fbe3b3f5
    container_name: clamav-web
    environment:
      DAEMON_ENDPOINT: clamav:3310
    ports:
      #http
      - "8091:8080"
    networks:
      - meldinger_network
    profiles:
      - virus-scan
    depends_on:
      clamav:
        condition: service_healthy

volumes:
  postgres-receiver-data:
  clamav-data:
  valkey-data:
  cloudstorage-data:
